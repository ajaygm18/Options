version: '3.8'

services:
  options-trading-system:
    build: .
    container_name: options-trading-system
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./tests:/app/tests
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - ENVIRONMENT=development
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    command: python scripts/run_paper_trading.py

